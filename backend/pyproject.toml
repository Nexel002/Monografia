[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "eclipse-sumo>=1.28.0",
    "opencv-python>=5.0.0.93",
    "pyproj>=3.8.0",
    "sumolib>=1.28.0",
    "traci>=1.28.0",
    "ultralytics>=8.4.175",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["slow: corre o SUMO a sério (alguns segundos)"]
